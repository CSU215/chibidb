[package]
name = "chaoticdb"
version = "0.1.0"
edition = "2024"

[dependencies]
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
