[package]
name = "chibidb"
version = "0.1.0"
edition = "2024"

[dependencies]
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
